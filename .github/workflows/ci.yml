name: CI

# Gatekeeper: every push and pull request must pass the full standard
# (composer validate -> code style -> static analysis -> boundaries -> tests)
# before it is valid for review.
on:
  push:
    branches: ['**']   # every version line (0.1, 0.2, …) and every feature branch
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    # Real PostGIS. The core owns tables — the registry's catalogue and per-area
    # ledger among them — so there is no honest version of this suite that does
    # not connect. Locally the same database lives on port 5434.
    services:
      postgres:
        image: ghcr.io/utafitilabs/postgis:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: uhifadhi_core_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      UHIFADHI_TEST_DATABASE_URL: "postgresql://app:app@127.0.0.1:5432/uhifadhi_core_test?serverVersion=17&charset=utf8"

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, iconv, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Validate the root manifest
        run: composer validate --strict

      # Every bundle is a package. Its manifest is validated as one, here,
      # because after a split that is exactly what it will be.
      - name: Validate every package manifest
        run: |
          for package in src/Uhifadhi/Contracts/composer.json src/Uhifadhi/Bundle/*/composer.json; do
            echo "== $package"
            composer validate --strict --no-check-all --working-dir="$(dirname "$package")"
          done

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      # `update`, not `install`: a library is tested against the versions its
      # constraints allow, and the lock is not committed.
      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Code style (php-cs-fixer)
        run: composer cs:check

      - name: Static analysis (PHPStan max)
        run: composer phpstan

      # The boundary between bundles, enforced. A symbol a bundle uses without
      # declaring the dependency that provides it fails the build.
      - name: Boundaries (composer-require-checker)
        run: composer require-check

      - name: Tests (PHPUnit)
        run: composer test

  # ── THE FLEET, AGAINST THIS COMMIT ──────────────────────────────────────
  # A module is green in its own CI against the core it happens to have
  # resolved, and red here against the core as it actually is. That gap is
  # how a shell selector a module restated stayed invisible until somebody
  # pushed the core: the module's suite was measuring a snapshot.
  #
  # So every module the fleet ships is checked out at its current line, POINTED AT THIS
  # CORE COMMIT, and put through its own `composer check`. A module that
  # breaks against the core the core is about to become fails the core's
  # push, which is where the breakage was introduced and where it is cheap.
  #
  # ONE PHP VERSION, DELIBERATELY. The matrix above already says the core
  # works on both; what this job asks is a different question — does the
  # fleet still work against it — and asking it twice would double the
  # slowest part of the build to learn nothing. 8.4 is the floor every
  # package declares, which is where a language-level break shows first.
  fleet-conformance:
    name: Fleet · ${{ matrix.module }}-module
    runs-on: ubuntu-latest
    needs: check

    strategy:
      fail-fast: false
      matrix:
        include:
          # Each module's own database, image and extensions, copied from its
          # own workflow rather than flattened into one: a module tested with
          # something other than what it asks for is not the module's suite.
          - module: patrol
            image: ghcr.io/utafitilabs/postgis:17
            database: patrol_bundle_test
            extensions: ctype, iconv, pdo_pgsql
          - module: incident
            image: ghcr.io/utafitilabs/postgis:17
            database: incidents_bundle_test
            extensions: ctype, iconv, pdo_pgsql
          - module: storage
            image: postgres:17
            database: storage_bundle_test
            # gd for the thumbnails, and imagick deliberately absent — the
            # module's own CI exercises the GD-only path on purpose.
            extensions: ctype, iconv, gd, fileinfo, pdo_pgsql
          - module: devkit
            image: ghcr.io/utafitilabs/postgis:17
            database: uhifadhi_devkit_test
            extensions: ctype, iconv
          - module: roster
            image: ghcr.io/utafitilabs/postgis:17
            database: roster_bundle_test
            extensions: ctype, iconv, pdo_pgsql

    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: ${{ matrix.database }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # EVERY NAME, ONE DATABASE. Each module's suite reads a variable of its
      # own naming, and an expression is NOT evaluated in an env KEY — only in
      # its value — so a single `${{ matrix.url_env }}:` would set a variable
      # literally called that and leave every suite unconfigured. All five are
      # named here instead, all pointing at the one database this job started;
      # the four a module does not read cost it nothing.
      PATROL_TEST_DATABASE_URL: "postgresql://app:app@127.0.0.1:5432/${{ matrix.database }}?serverVersion=17&charset=utf8"
      INCIDENTS_TEST_DATABASE_URL: "postgresql://app:app@127.0.0.1:5432/${{ matrix.database }}?serverVersion=17&charset=utf8"
      STORAGE_TEST_DATABASE_URL: "postgresql://app:app@127.0.0.1:5432/${{ matrix.database }}?serverVersion=17&charset=utf8"
      UHIFADHI_TEST_DATABASE_URL: "postgresql://app:app@127.0.0.1:5432/${{ matrix.database }}?serverVersion=17&charset=utf8"
      ROSTER_TEST_DATABASE_URL: "postgresql://app:app@127.0.0.1:5432/${{ matrix.database }}?serverVersion=17&charset=utf8"

    steps:
      - name: Check out this core
        uses: actions/checkout@v4
        with:
          path: core

      - name: Check out the module at its current line
        uses: actions/checkout@v4
        with:
          repository: utafitilabs/${{ matrix.module }}-module
          # No ref: the repository's default branch is its current version line
          # (0.3, 0.7, …), the Symfony shape — main no longer exists.
          # Every fleet module is public, so the job's own token checks it out.
          # A private module would need a Contents:read token added here.
          path: module

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ${{ matrix.extensions }}
          coverage: none
          tools: composer:v2

      # PREPENDED, NOT APPENDED, and that is the whole point of the step. A
      # module already carries a VCS repository for the core, Composer takes
      # the FIRST repository that provides a package, and a path repository
      # added after it would resolve the PUBLISHED core — which is exactly
      # the stale snapshot this job exists to catch.
      #
      # THE PATH REPOSITORY STATES THE VERSION IT SERVES, because a checkout is
      # not a branch: `versions` is the documented option for exactly this.
      #   "When the version cannot be inferred from the local VCS repository, or
      #    when you want to override the version, you can use the `versions`
      #    option when declaring the repository"
      #   @see https://getcomposer.org/doc/05-repositories.md#path
      #   @see composer/src/Composer/Repository/PathRepository.php — loadPackageFromFileSystem(),
      #        `if (isset($package['name'], $this->options['versions'][$package['name']]))`
      #
      # THE LINE IS THE BRANCH, AND NOTHING ELSE. `extra.branch-alias` is gone
      # from this core: a branch whose name is a version line already IS a
      # version to Composer —
      #   "you must specify a version constraint that looks like this:
      #    `v1.x-dev`. The `.x` is an arbitrary string that Composer requires to
      #    tell it that we're talking about the `v1` branch and not a `v1` tag"
      #   @see https://getcomposer.org/doc/articles/versions.md#branches
      #   @see composer/vendor/composer/semver/src/VersionParser.php — normalizeBranch(),
      #        a `\d+(\.\d+)*` branch becomes `<line>.x-dev`, anything else `dev-<branch>`
      # so the branch name is read from the event GitHub names it in, not from a
      # working copy: `actions/checkout` is given no ref here, and on a pull
      # request the commit under test belongs to the BASE line.
      #   @see https://docs.github.com/en/actions/reference/variables-reference#default-environment-variables
      #
      # THE REQUIREMENT IS REWRITTEN TOO. The module's own constraint is a caret
      # against tags (`^0.1`), which a dev version does not satisfy under a
      # stable floor; a `x-dev` constraint carries its own stability, so no
      # `@dev` flag and no `minimum-stability` edit is needed —
      #   @see composer/src/Composer/Package/Loader/RootPackageLoader.php —
      #        extractStabilityFlags(), a non-stable constraint sets that
      #        package's stability flag by itself.
      # The module is being tested against the core's NEXT commit on purpose.
      - name: Point the module at this core commit
        working-directory: module
        env:
          CORE_LINE: ${{ github.base_ref || github.ref_name }}
        run: |
          line="$CORE_LINE"
          case "$line" in
            [0-9]*.[0-9]*) version="${line}.x-dev" ;;
            *) version="dev-${line}" ;;
          esac
          echo "core line $line → $version"
          tmp="$(mktemp)"
          jq --arg v "$version" '.repositories = ([{
                type: "path",
                url: "../core",
                options: { versions: { "uhifadhi/uhifadhi": $v } }
              }] + (.repositories // [])) | .require["uhifadhi/uhifadhi"] = $v' composer.json > "$tmp"
          mv "$tmp" composer.json
          composer validate --no-check-all --no-check-publish

      # `update`, not `install`: no module commits a lock, so there is nothing
      # to preserve and everything resolves fresh — with the core coming from
      # the path repository above and from nowhere else.
      - name: Install the module against it
        working-directory: module
        run: composer update --no-interaction --no-progress --prefer-dist

      # SAID OUT LOUD, so a green run cannot be a run against the wrong core.
      - name: Say which core it resolved
        working-directory: module
        run: composer show uhifadhi/uhifadhi | head -20

      - name: The module's own standard
        working-directory: module
        run: composer check
